<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deming Lin - Online Resume</title>
    <script type="text/javascript">
      // GitHub Pages serves 404.html for any unknown path but keeps the
      // requested URL in the address bar. Stash it and redirect to the SPA
      // root; index.html will restore the original route client-side.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
